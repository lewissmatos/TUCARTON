services:
  postgres:
    image: postgres:17.11-alpine3.24
    container_name: tucarton-postgres
    environment:
      POSTGRES_DB: tucarton
      POSTGRES_USER: tucarton
      POSTGRES_PASSWORD: tucarton_local_development_only
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tucarton -d tucarton']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
